title: BICEP User Guide
email: tim.yoder@pnnl.gov
description: >- 
  Building Infrastructure Cost Estimation Program

baseurl: "/BICEP"
url: "https://pnnl.github.io"
github_username:  pnnl

# Custom CSS
custom_css_path: "/BICEP/assets/custom.css"

# Navigation
header_pages:
  - getting-started.md
  - data-requirements.md
  - methodology.md
  - examples/index.md
  - api-reference.md
  - jekyll-sitemap

# Just the Docs theme settings
color_scheme: light
search_enabled: true
search_button: false

# Suppress Sass deprecation warnings from theme
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Navigation structure
nav_order: 1  # for pages

